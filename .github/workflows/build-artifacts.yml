name: Build Docker Artifacts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image (tag prod)
        run: docker build -t rootify-api:prod ./api

      - name: Build cache image (tag prod)
        run: docker build -t rootify-cache:prod ./cache_service

      - name: Save images to tar.gz
        run: |
          mkdir -p artifacts
          docker save rootify-api:prod | gzip > artifacts/rootify-api-prod.tar.gz
          docker save rootify-cache:prod | gzip > artifacts/rootify-cache-prod.tar.gz
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootify-docker-images
          path: rootify/artifacts/*.tar.gz
          if-no-files-found: error
