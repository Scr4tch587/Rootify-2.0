name: Build and Deploy Docker Artifacts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image (tag prod)
        run: docker build -t rootify-api:prod ./api

      - name: Build cache image (tag prod)
        run: docker build -t rootify-cache:prod ./cache_service

      - name: Inspect image sizes
        run: |
          echo "=== Docker image sizes ==="
          docker images | grep rootify || true

      - name: Save images to tar.gz (fast)
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz
          mkdir -p artifacts
          docker save rootify-api:prod | pigz -p 4 > artifacts/rootify-api-prod.tar.gz
          docker save rootify-cache:prod | pigz -p 4 > artifacts/rootify-cache-prod.tar.gz
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootify-docker-images
          path: rootify/artifacts/*.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: rootify-docker-images
          path: artifacts

      - name: Show artifact files
        run: ls -lh artifacts

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy artifacts to VM
        run: |
          scp -i ~/.ssh/id_rsa artifacts/*.tar.gz \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/

      - name: Deploy on VM (load + compose up)
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "VM_PROJECT_DIR='${{ secrets.VM_PROJECT_DIR }}' bash -s" << 'EOF'
          set -euo pipefail

          cd "$VM_PROJECT_DIR"

          mkdir -p artifacts
          mv /tmp/rootify-*-prod.tar.gz artifacts/ || true

          gunzip -c artifacts/rootify-api-prod.tar.gz | docker load
          gunzip -c artifacts/rootify-cache-prod.tar.gz | docker load

          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

          docker ps
          EOF

