name: Build Docker Artifacts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image (tag prod)
        run: docker build -t rootify-api:prod ./api

      - name: Build api image (tag prod)
        run: docker build -t rootify-api:prod ./api

      - name: Debug image layers
        run: |
          echo "=== docker history (top layers) ==="
          docker history rootify-api:prod | head -n 30

      - name: Debug biggest dirs inside image
        run: |
          echo "=== biggest dirs inside container ==="
          docker run --rm rootify-api:prod sh -lc 'du -h -d 3 / 2>/dev/null | sort -h | tail -n 40'

      - name: Build cache image (tag prod)
        run: docker build -t rootify-cache:prod ./cache_service

      - name: Inspect image sizes
        run: |
          echo "=== Docker image sizes ==="
          docker images | grep rootify || true

      - name: Save images to tar.gz (fast)
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz

          mkdir -p artifacts

          echo "Images:"
          docker images | grep rootify || true

          echo "Saving api..."
          docker save rootify-api:prod | pigz -p 4 > artifacts/rootify-api-prod.tar.gz

          echo "Saving cache..."
          docker save rootify-cache:prod | pigz -p 4 > artifacts/rootify-cache-prod.tar.gz

          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootify-docker-images
          path: rootify/artifacts/*.tar.gz
          if-no-files-found: error
